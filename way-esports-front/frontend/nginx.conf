server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Keep directory redirects relative when served behind the HTTPS reverse proxy.
    absolute_redirect off;

    # Preserve incoming links to the retired translation.
    location = /ru/about { return 301 /about/; }
    location = /ru/about/ { return 301 /about/; }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Кэшируем статику
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA fallback: все несуществующие пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}


